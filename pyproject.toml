[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emotion-rl"
version = "2.0.0"
description = "Emotion-aware assistant whose response policy is learned with reinforcement learning on a heterogeneous user simulator."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Divyansh Kaushal" }]
dependencies = [
    "numpy>=1.26,<3",
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.4,<3",
    "sb3-contrib>=2.4,<3",
    "torch>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
vision = ["opencv-python>=4.9", "deepface>=0.0.93", "tensorflow>=2.16", "tf-keras>=2.16",
          "hsemotion-onnx>=0.3"]
assistant = ["google-genai>=1.0", "pyttsx3>=2.90", "python-dotenv>=1.0",
             "pywin32>=306; sys_platform == 'win32'"]
voice = ["faster-whisper>=1.0", "sounddevice>=0.4"]
web = ["streamlit>=1.35", "opencv-python>=4.9"]
dev = ["pytest>=8", "ruff>=0.5", "python-dotenv>=1.0"]
all = ["emotion-rl[vision,assistant,voice,web,dev]"]

[project.scripts]
emotion-rl-train = "emotion_rl.train:main"
emotion-rl-evaluate = "emotion_rl.evaluate:main"
emotion-rl-assistant = "emotion_rl.assistant.app:main"
emotion-rl-eval-detector = "emotion_rl.detector_eval:main"
emotion-rl-train-cnn = "emotion_rl.emotion_cnn:main"
emotion-rl-study = "emotion_rl.study:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["venv", "legacy"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E241", "B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
